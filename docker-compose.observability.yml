services:
  intentgate:
    build: .
    environment:
      UIG_STATE_DIR: /state
      UIG_INGEST_TOKEN: ${UIG_INGEST_TOKEN:-local-dev-change-me}
    volumes:
      - ./.intentgate-state:/state
    ports:
      - "8787:8787"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on: [intentgate]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-intentgate}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  collector:
    build: .
    command: ["uig-collector", "/config/integrations.json", "--interval", "30"]
    profiles: ["collectors"]
    environment:
      UIG_STATE_DIR: /state
    env_file:
      - path: .env.integrations
        required: false
    volumes:
      - ./.intentgate-state:/state
      - ./config/integrations.json:/config/integrations.json:ro
    restart: unless-stopped

  notifier:
    build: .
    command: ["uig-notifier", "--interval", "10"]
    profiles: ["notifications"]
    environment:
      UIG_STATE_DIR: /state
      UIG_MANAGER_WEBHOOK_URL: ${UIG_MANAGER_WEBHOOK_URL:-}
      UIG_MANAGER_WEBHOOK_TOKEN: ${UIG_MANAGER_WEBHOOK_TOKEN:-}
      UIG_MANAGER_WEBHOOK_STYLE: ${UIG_MANAGER_WEBHOOK_STYLE:-generic}
    volumes:
      - ./.intentgate-state:/state
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
