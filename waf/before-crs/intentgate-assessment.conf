# The assessment API is intentionally designed to receive shell and PowerShell
# command text. Generic RCE signatures would otherwise reject the content before
# Intent Gate can classify it. Limit this exclusion to the assessment route and
# keep SQLi, protocol, request-size, method, and all other CRS protections active.
SecRule REQUEST_URI "@rx ^/v1/(?:model-)?assess$" \
    "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-rce"
