name: Feature request
description: Propose a policy, integration, workflow, or observability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What security or usability problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the behavior, relevant platforms, and expected decision impact.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: False-positive, privacy, and latency tradeoffs
    validations:
      required: true

