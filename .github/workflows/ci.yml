name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose
        run: docker compose -f docker-compose.observability.yml config --quiet

  waf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Start protected API edge
        run: docker compose -f docker-compose.observability.yml up -d --build intentgate waf
      - name: Verify benign traffic and backend isolation
        shell: bash
        run: |
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8787/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --get --data-urlencode 'user=example-user' http://127.0.0.1:8787/v1/posture)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Authorization: Bearer local-dev-change-me' --header 'Content-Type: application/json' --data '{"source":"ci","event_id":"benign","score":1,"confidence":1,"ttl_seconds":60,"detail":"WAF verification"}' http://127.0.0.1:8787/v1/signals)" = "202"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Authorization: Bearer local-dev-change-me' --header 'Content-Type: application/json' --data '{"argv":["Get-ChildItem","src"],"purpose":"Inspect project source files","cwd":"/app"}' http://127.0.0.1:8787/v1/assess)" = "200"
          intentgate_id="$(docker compose -f docker-compose.observability.yml ps --quiet intentgate)"
          docker inspect "$intentgate_id" | jq --exit-status '.[0].NetworkSettings.Ports["8787/tcp"] == null'
      - name: Verify CRS blocks an injection probe
        shell: bash
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --get --data-urlencode "user=' OR 1=1 --" http://127.0.0.1:8787/v1/posture)" = "403"
      - name: Show WAF logs on failure
        if: failure()
        run: docker compose -f docker-compose.observability.yml logs waf
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.observability.yml down --volumes

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - name: Check formatting
        run: terraform -chdir=deploy/terraform fmt -check -recursive
      - name: Initialize providers
        run: terraform -chdir=deploy/terraform init -backend=false
      - name: Validate configuration
        run: terraform -chdir=deploy/terraform validate

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Ansible
        run: python -m pip install "ansible-core>=2.18,<2.20" ansible-lint
      - name: Install collections
        run: ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Syntax check
        working-directory: deploy/ansible
        run: ansible-playbook -i inventories/example.ini deploy.yml --syntax-check
      - name: Lint playbook and role
        working-directory: deploy/ansible
        run: ansible-lint deploy.yml roles
