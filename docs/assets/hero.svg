<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">User Intent AI Security</title>
  <desc id="desc">A command prompt protected by a glowing shield and contextual security signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#10283f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4f7b9d" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="990" cy="180" r="130" fill="#38bdf8" opacity=".05"/>
  <path d="M980 68l105 39v70c0 75-42 123-105 151-63-28-105-76-105-151v-70z" fill="#07111f" stroke="url(#accent)" stroke-width="5" filter="url(#glow)"/>
  <path d="M932 181l31 31 65-73" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="66" width="650" height="222" rx="18" fill="#050b13" stroke="#28445d" stroke-width="2"/>
  <circle cx="104" cy="96" r="7" fill="#fb7185"/><circle cx="129" cy="96" r="7" fill="#fbbf24"/><circle cx="154" cy="96" r="7" fill="#34d399"/>
  <text x="104" y="158" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">$ intentgate assess</text>
  <text x="104" y="202" fill="#dbeafe" font-family="Inter, Segoe UI, sans-serif" font-size="32" font-weight="700">USER INTENT AI SECURITY</text>
  <text x="104" y="240" fill="#8ba7bd" font-family="Inter, Segoe UI, sans-serif" font-size="18">Context-aware protection before commands execute.</text>
  <rect x="104" y="260" width="104" height="6" rx="3" fill="#38bdf8"/><rect x="216" y="260" width="72" height="6" rx="3" fill="#34d399"/><rect x="296" y="260" width="44" height="6" rx="3" fill="#fbbf24"/>
</svg>
